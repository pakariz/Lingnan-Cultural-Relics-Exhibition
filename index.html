<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>数字文物展馆</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --panel: #f5f1eb;
            --panel-light: #faf7f2;
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-weak: rgba(37, 99, 235, 0.12);
            --shadow: rgba(0, 0, 0, 0.08);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', '宋体', 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .page {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        .app {
            display: flex;
            width: 100vw;
            flex: 1;
            min-height: 0;
        }

        .left-panel,
        .right-panel {
            width: 320px;
            min-width: 280px;
            max-width: 420px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .right-panel {
            border-right: none;
            border-left: 1px solid var(--border);
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0b0f16;
        }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(18, 18, 18, 0.92);
            color: #f9fafb;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .topbar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .topbar .brand>span:first-child {
            color: rgba(245, 241, 235, 1);
        }

        .topbar .hint {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.65);
            margin-left: 10px;
            font-weight: 400;
        }

        .topbar .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn.primary {
            border-color: rgba(37, 99, 235, 0.45);
            background: rgba(37, 99, 235, 0.22);
        }

        /* 常见网页式：仅图标的刷新按钮 */
        .btn.btn-icon-refresh {
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .btn.btn-icon-refresh svg {
            display: block;
            transform: scaleX(-1);
        }

        /* 顶栏：编辑模式 — 白底黑字 */
        .btn.btn-toolbar-light {
            background: #f5f1eb;
            color: #111827;
            border-color: rgba(0, 0, 0, 0.12);
        }

        .btn.btn-toolbar-light:hover {
            background: #e7e1d6;
        }

        .panel-header {
            padding: 14px 14px 10px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header .title {
            font-weight: 800;
            font-size: 14px;
        }

        .panel-header .sub {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .panel-body {
            padding: 12px;
            overflow: auto;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            border: none;
            border-radius: 10px;
            padding: 10px 10px 10px 12px;
            cursor: pointer;
            background: var(--panel-light);
            transition: 0.15s;
        }

        .list-item:hover {
            box-shadow: 0 6px 18px var(--shadow);
            transform: translateY(-1px);
        }

        .list-item.active {
            background: #456CBF;
            color: #ffffff;
        }

        .list-item.active .name {
            color: #ffffff;
        }

        .list-item.active .desc {
            color: rgba(255, 255, 255, 0.9);
        }

        .list-item .name {
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .list-item .desc {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.45;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            outline: none;
        }

        .statusbar {
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(11, 15, 22, 0.92);
        }

        .detail-title {
            font-weight: 900;
            font-size: 16px;
            margin: 0 0 10px;
        }

        .detail-block {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 10px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .detail-text {
            font-size: 13px;
            line-height: 1.6;
            color: #111827;
            white-space: pre-wrap;
        }

        .kv {
            display: grid;
            grid-template-columns: 72px 1fr;
            gap: 8px 10px;
            font-size: 13px;
        }

        .kv .k {
            color: var(--muted);
        }

        .kv .v {
            color: #111827;
            word-break: break-word;
        }

        .hidden {
            display: none !important;
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-row label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-row input,
        .form-row textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 10px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .form-row textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-section {
            margin-top: 6px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.45);
        }

        .form-section-title {
            font-size: 12px;
            color: var(--muted);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .form-grid.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .form-field label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-field input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .form-field input[type="color"] {
            height: 38px;
            padding: 3px;
            cursor: pointer;
            background: #ffffff;
        }

        .form-field input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
            border-radius: 6px;
        }

        .form-field input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
        }

        .form-actions .btn {
            flex: 1;
            border-color: rgba(17, 24, 39, 0.12);
            background: rgba(17, 24, 39, 0.04);
            color: #111827;
        }

        .form-actions .btn:hover {
            background: rgba(17, 24, 39, 0.06);
        }

        .form-actions .btn.danger {
            border: none;
            background-color: rgba(200, 65, 65, 1);
            color: rgba(245, 241, 235, 1);
        }

        .form-actions .btn.danger:hover {
            background-color: rgba(175, 50, 50, 1);
            color: rgba(245, 241, 235, 1);
        }

        .notice {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 6px; }

        @media (max-width: 1000px) {
            .left-panel { width: 280px; }
            .right-panel { width: 300px; }
        }

        @media (max-width: 820px) {
            .left-panel { display: none; }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="brand">
            <span>数字文物展馆</span>
            <span class="hint">拖拽旋转 | 右键平移 | 滚轮缩放</span>
        </div>
        <div class="actions">
            <button type="button" class="btn btn-icon-refresh" id="refresh-btn" title="刷新列表" aria-label="刷新列表">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 13a9 9 0 1 0 2.64-6.36"/>
                    <path d="M3 4v6h6"/>
                </svg>
            </button>
            <button type="button" class="btn btn-toolbar-light" id="toggle-edit-btn">编辑模式</button>
        </div>
    </div>

<div class="app">
    <div class="left-panel" id="left-panel">
        <div class="panel-header">
            <div class="title">文物展品</div>
            <div class="sub">共 <span id="artifact-count">0</span> 件展品</div>
        </div>
        <div class="panel-body">
            <div class="list" id="artifact-list"></div>
        </div>
    </div>

    <div class="center-panel">
        <div id="canvas-container"></div>
        <div class="statusbar">
            <div>后端状态：<span id="backend-status">未连接</span></div>
            <div id="model-status"></div>
        </div>
    </div>

    <div class="right-panel">
        <div class="panel-header">
            <div class="title" id="right-title">文物信息</div>
            <div class="sub" id="right-sub">选择左侧文物查看详情</div>
        </div>

        <div class="panel-body" id="view-pane">
            <h2 class="detail-title" id="detail-name">-</h2>

            <div class="detail-block">
                <div class="detail-label">文物简介</div>
                <div class="detail-text" id="detail-desc">-</div>
            </div>

            <div class="detail-block">
                <div class="detail-label">详细信息</div>
                <div class="kv">
                    <div class="k">年代</div><div class="v" id="detail-era">-</div>
                    <div class="k">类别</div><div class="v" id="detail-category">-</div>
                    <div class="k">产地</div><div class="v" id="detail-origin">-</div>
                    <div class="k">材质</div><div class="v" id="detail-material">-</div>
                    <div class="k">尺寸</div><div class="v" id="detail-dimensions">-</div>
                </div>
            </div>
        </div>

        <div class="panel-body hidden" id="edit-pane">
            <div class="notice">编辑/新增会保存到后端 `backend/data/artifacts.json`，模型文件会放到根目录 `models/`。把模型直接复制进 `models/`，刷新列表也会自动出现。</div>
            <div style="height: 10px"></div>

            <form class="form" id="artifact-form">
                <div class="form-row">
                    <label>文物名称</label>
                    <input id="form-name" placeholder="例如：青铜爵杯" required>
                </div>
                <div class="form-row">
                    <label>文物简介</label>
                    <textarea id="form-description" placeholder="介绍文物的背景、用途、文化意义等"></textarea>
                </div>
                <div class="form-row">
                    <label>年代</label>
                    <input id="form-era" placeholder="例如：商代晚期（公元前13-11世纪）">
                </div>
                <div class="form-row">
                    <label>类别</label>
                    <input id="form-category" placeholder="例如：礼器">
                </div>
                <div class="form-row">
                    <label>产地</label>
                    <input id="form-origin" placeholder="例如：中原诸侯区域">
                </div>
                <div class="form-row">
                    <label>材质</label>
                    <input id="form-material" placeholder="例如：青铜">
                </div>
                <div class="form-row">
                    <label>尺寸</label>
                    <input id="form-dimensions" placeholder="例如：高 38cm，口径 30cm">
                </div>
                <div class="form-row">
                    <label>3D 模型文件（可选：glb/gltf/obj）</label>
                    <input type="file" id="form-model" accept=".glb,.gltf,.obj">
                </div>
                <div class="form-section">
                    <div class="form-section-title">模型属性</div>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>自发光强度</label>
                            <input id="form-emissive-intensity" type="number" min="0" max="2" step="0.01" value="0.35" placeholder="0.35">
                        </div>
                        <div class="form-field">
                            <label>显示尺寸（缩放）</label>
                            <input id="form-model-scale" type="number" min="0.05" max="20" step="0.01" value="1" placeholder="1.00">
                        </div>
                    </div>
                    <div style="height: 8px;"></div>
                    <div class="form-grid three">
                        <div class="form-field">
                            <label>X 坐标</label>
                            <input id="form-pos-x" type="number" step="0.01" value="0" placeholder="0">
                        </div>
                        <div class="form-field">
                            <label>Y 坐标</label>
                            <input id="form-pos-y" type="number" step="0.01" value="-0.2" placeholder="-0.2">
                        </div>
                        <div class="form-field">
                            <label>Z 坐标</label>
                            <input id="form-pos-z" type="number" step="0.01" value="0" placeholder="0">
                        </div>
                    </div>
                </div>
                <div class="form-section">
                    <div class="form-section-title">环境与光照</div>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>世界背景颜色</label>
                            <input id="form-bg-color" type="color" value="#000000">
                        </div>
                        <div class="form-field">
                            <label>外部光源总强度</label>
                            <input id="form-env-light-intensity" type="number" min="0" max="3" step="0.01" value="1" placeholder="1.00">
                        </div>
                    </div>
                    <div style="height: 8px;"></div>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>额外点光源颜色</label>
                            <input id="form-extra-light-color" type="color" value="#ffd8b0">
                        </div>
                        <div class="form-field">
                            <label>额外点光源强度</label>
                            <input id="form-extra-light-intensity" type="number" min="0" max="4" step="0.01" value="0.25" placeholder="0.25">
                        </div>
                    </div>
                    <div style="height: 8px;"></div>
                    <div class="form-grid three">
                        <div class="form-field">
                            <label>额外光源 X</label>
                            <input id="form-extra-light-x" type="number" step="0.01" value="0">
                        </div>
                        <div class="form-field">
                            <label>额外光源 Y</label>
                            <input id="form-extra-light-y" type="number" step="0.01" value="2.2">
                        </div>
                        <div class="form-field">
                            <label>额外光源 Z</label>
                            <input id="form-extra-light-z" type="number" step="0.01" value="1.8">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn" id="new-btn">新增</button>
                    <button type="submit" class="btn primary" id="save-btn">保存</button>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn danger" id="delete-btn">删除当前文物</button>
                </div>
                <div class="notice" id="form-status"></div>
            </form>
        </div>
    </div>
</div>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    
    // --- 初始化场景 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.0023);
    
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(3, 2.2, 5);
    camera.lookAt(0, 0.3, 0);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    
    // --- 轨道控制 ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 1.5;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.8;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.target.set(0, 0.4, 0);
    
    // ========= 光照系统：温和适度，保留模型原始配色 =========
    const ambientLight = new THREE.AmbientLight(0x334155, 0.55);
    scene.add(ambientLight);
    
    const mainLight = new THREE.DirectionalLight(0xfff3e0, 0.85);
    mainLight.position.set(2, 3, 2);
    mainLight.castShadow = true;
    mainLight.receiveShadow = false;
    mainLight.shadow.mapSize.width = 512;
    mainLight.shadow.mapSize.height = 512;
    scene.add(mainLight);
    
    const backLight = new THREE.PointLight(0x7aa7cc, 0.42);
    backLight.position.set(-1.2, 1.5, -2);
    scene.add(backLight);
    
    const fillRight = new THREE.PointLight(0xd6a27a, 0.38);
    fillRight.position.set(1.8, 1, 1.5);
    scene.add(fillRight);
    
    const fillBottom = new THREE.PointLight(0x9a7a5f, 0.28);
    fillBottom.position.set(0, -0.6, 0);
    scene.add(fillBottom);

    const extraLight = new THREE.PointLight(0xffd8b0, 0.25);
    extraLight.position.set(0, 2.2, 1.8);
    scene.add(extraLight);
    
    // 地面装饰网格
    const gridHelper = new THREE.GridHelper(6, 16, 0x675944, 0x2a231a);
    gridHelper.position.y = -0.7;
    gridHelper.material.transparent = true;
    gridHelper.material.opacity = 0.25;
    scene.add(gridHelper);
    
    // ========= 温和自发光增强函数 =========
    function enhanceImportedModel(model, intensity = 0.35) {
        if (!model) return;
        model.traverse((child) => {
            if (child.isMesh) {
                const materials = Array.isArray(child.material) ? child.material : [child.material];
                materials.forEach(mat => {
                    if (mat) {
                        if (mat.color) {
                            const c = mat.color;
                            // 依据原色生成偏暖自发光，避免暗部细节丢失
                            mat.emissive = new THREE.Color(c.r * 0.95, c.g * 0.85, c.b * 0.75);
                        } else {
                            mat.emissive = new THREE.Color(0x8a6647);
                        }
                        mat.emissiveIntensity = intensity;
                        if ("needsUpdate" in mat) mat.needsUpdate = true;
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
            }
        });
    }

    // --- 文物数据来自后端 ---
    let artifacts = [];
    let selectedArtifactId = "";
    let currentModel = null;
    
    const gltfLoader = new GLTFLoader();
    const objLoader = new OBJLoader();
    const mtlLoader = new MTLLoader();
    
    function removeCurrentModel() {
        if (currentModel) {
            scene.remove(currentModel);
            currentModel = null;
        }
    }
    
    function createFallbackModel() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0xb87333, metalness: 0.85, roughness: 0.32, emissive: 0x6b3f22, emissiveIntensity: 0.2 });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.45, 0.75, 28), mat);
        body.position.y = 0;
        group.add(body);
        const handle = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.06, 16, 40, Math.PI), mat);
        handle.position.set(-0.45, 0.15, 0.25);
        handle.rotation.x = 0.3;
        handle.rotation.z = 1.8;
        group.add(handle);
        group.position.y = -0.2;
        return group;
    }

    async function loadModelFromUrl(modelUrl) {
        if (!modelUrl) {
            return null;
        }
        const lower = modelUrl.toLowerCase();
        if (lower.endsWith(".glb") || lower.endsWith(".gltf")) {
            const gltf = await gltfLoader.loadAsync(modelUrl);
            return gltf.scene;
        }
        if (lower.endsWith(".obj")) {
            const basePath = THREE.LoaderUtils.extractUrlBase(modelUrl);
            const mtlUrl = modelUrl.replace(/\.[^/.]+$/, ".mtl");
            try {
                mtlLoader.setResourcePath(basePath);
                const materials = await mtlLoader.loadAsync(mtlUrl);
                materials.preload();
                objLoader.setMaterials(materials);
                objLoader.setResourcePath(basePath);
            } catch (err) {
                console.warn("未找到或无法加载同名 .mtl，按无贴图 OBJ 回退：", mtlUrl, err);
                objLoader.setMaterials(null);
                objLoader.setResourcePath(basePath);
            }
            return await objLoader.loadAsync(modelUrl);
        }
        return null;
    }

    function getModelSettings(artifact) {
        const toNumber = (v, fallback) => {
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        };
        const toColor = (v, fallback) => {
            const s = String(v || "").trim();
            return /^#[0-9a-fA-F]{6}$/.test(s) ? s : fallback;
        };
        return {
            emissiveIntensity: Math.max(0, toNumber(artifact?.emissiveIntensity, 0.35)),
            modelScale: Math.max(0.05, toNumber(artifact?.modelScale, 1)),
            posX: toNumber(artifact?.posX, 0),
            posY: toNumber(artifact?.posY, -0.2),
            posZ: toNumber(artifact?.posZ, 0),
            bgColor: toColor(artifact?.bgColor, "#000000"),
            envLightIntensity: Math.max(0, toNumber(artifact?.envLightIntensity, 1)),
            extraLightColor: toColor(artifact?.extraLightColor, "#ffd8b0"),
            extraLightIntensity: Math.max(0, toNumber(artifact?.extraLightIntensity, 0.25)),
            extraLightX: toNumber(artifact?.extraLightX, 0),
            extraLightY: toNumber(artifact?.extraLightY, 2.2),
            extraLightZ: toNumber(artifact?.extraLightZ, 1.8),
        };
    }

    function applySceneEnvironment(settings) {
        const envScale = settings?.envLightIntensity ?? 1;
        scene.background = new THREE.Color(settings?.bgColor || "#000000");
        if (scene.fog) {
            scene.fog.color.set(settings?.bgColor || "#000000");
        }
        ambientLight.intensity = 0.55 * envScale;
        mainLight.intensity = 0.85 * envScale;
        backLight.intensity = 0.42 * envScale;
        fillRight.intensity = 0.38 * envScale;
        fillBottom.intensity = 0.28 * envScale;
        extraLight.color.set(settings?.extraLightColor || "#ffd8b0");
        extraLight.intensity = settings?.extraLightIntensity ?? 0.25;
        extraLight.position.set(settings?.extraLightX ?? 0, settings?.extraLightY ?? 2.2, settings?.extraLightZ ?? 1.8);
    }

    function fitModelToView(modelGroup, settings) {
        if (!modelGroup) return;
        const safeSettings = settings || {
            modelScale: 1,
            posX: 0,
            posY: -0.2,
            posZ: 0,
        };
        const box = new THREE.Box3().setFromObject(modelGroup);
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        let scale = 1;
        if (Number.isFinite(maxDim) && maxDim > 1.7) {
            scale = 1.35 / maxDim;
        }
        modelGroup.scale.setScalar(scale * safeSettings.modelScale);
        modelGroup.position.set(safeSettings.posX, safeSettings.posY, safeSettings.posZ);
    }

    function updateRightPane(artifact) {
        document.getElementById("detail-name").innerText = artifact?.name || "-";
        document.getElementById("detail-desc").innerText = artifact?.description || "-";
        document.getElementById("detail-era").innerText = artifact?.era || "-";
        document.getElementById("detail-category").innerText = artifact?.category || "-";
        document.getElementById("detail-origin").innerText = artifact?.origin || "-";
        document.getElementById("detail-material").innerText = artifact?.material || "-";
        document.getElementById("detail-dimensions").innerText = artifact?.dimensions || "-";
        document.getElementById("right-sub").innerText = artifact?.modelFile ? `模型：${artifact.modelFile}` : "未绑定模型";
    }

    function setBackendStatus(ok, text) {
        const el = document.getElementById("backend-status");
        el.innerText = text;
        el.style.color = ok ? "#a7f3d0" : "#fca5a5";
    }

    function renderArtifactList() {
        const list = document.getElementById("artifact-list");
        const countEl = document.getElementById("artifact-count");
        list.innerHTML = "";
        countEl.innerText = String(artifacts.length);

        artifacts.forEach((artifact) => {
            const item = document.createElement("div");
            item.className = "list-item" + (artifact.id === selectedArtifactId ? " active" : "");
            item.innerHTML = `
                <div class="name">${escapeHtml(artifact.name || "未命名文物")}</div>
                <div class="desc">${escapeHtml((artifact.description || "").slice(0, 70) || "暂无简介")}</div>
            `;
            item.addEventListener("click", () => selectArtifact(artifact.id));
            list.appendChild(item);
        });
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;",
        }[c]));
    }

    async function selectArtifact(id) {
        selectedArtifactId = id;
        renderArtifactList();
        const artifact = artifacts.find((a) => a.id === id);
        updateRightPane(artifact);
        fillFormFromArtifact(artifact);
        await displayArtifact(artifact);
    }

    // 展示文物
    async function displayArtifact(artifact) {
        removeCurrentModel();
        const status = document.getElementById("model-status");
        status.innerText = "";

        let modelGroup = null;
        try {
            const modelUrl = artifact?.modelUrl || "";
            const modelSettings = getModelSettings(artifact);
            applySceneEnvironment(modelSettings);
            if (modelUrl) {
                status.innerText = "加载模型中...";
                modelGroup = await loadModelFromUrl(modelUrl);
                fitModelToView(modelGroup, modelSettings);
                enhanceImportedModel(modelGroup, modelSettings.emissiveIntensity);
                status.innerText = "模型已加载";
            } else {
                modelGroup = createFallbackModel();
                fitModelToView(modelGroup, modelSettings);
                enhanceImportedModel(modelGroup, modelSettings.emissiveIntensity);
                status.innerText = "未绑定模型，展示占位模型";
            }
        } catch (e) {
            console.error("模型加载失败", e);
            modelGroup = createFallbackModel();
            status.innerText = "模型加载失败，展示占位模型";
        }
        
        if (modelGroup) {
            modelGroup.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
            scene.add(modelGroup);
            currentModel = modelGroup;
        }
    }

    function fillFormFromArtifact(artifact) {
        document.getElementById("form-name").value = artifact?.name || "";
        document.getElementById("form-description").value = artifact?.description || "";
        document.getElementById("form-era").value = artifact?.era || "";
        document.getElementById("form-category").value = artifact?.category || "";
        document.getElementById("form-origin").value = artifact?.origin || "";
        document.getElementById("form-material").value = artifact?.material || "";
        document.getElementById("form-dimensions").value = artifact?.dimensions || "";
        const modelSettings = getModelSettings(artifact);
        document.getElementById("form-emissive-intensity").value = String(modelSettings.emissiveIntensity);
        document.getElementById("form-model-scale").value = String(modelSettings.modelScale);
        document.getElementById("form-pos-x").value = String(modelSettings.posX);
        document.getElementById("form-pos-y").value = String(modelSettings.posY);
        document.getElementById("form-pos-z").value = String(modelSettings.posZ);
        document.getElementById("form-bg-color").value = modelSettings.bgColor;
        document.getElementById("form-env-light-intensity").value = String(modelSettings.envLightIntensity);
        document.getElementById("form-extra-light-color").value = modelSettings.extraLightColor;
        document.getElementById("form-extra-light-intensity").value = String(modelSettings.extraLightIntensity);
        document.getElementById("form-extra-light-x").value = String(modelSettings.extraLightX);
        document.getElementById("form-extra-light-y").value = String(modelSettings.extraLightY);
        document.getElementById("form-extra-light-z").value = String(modelSettings.extraLightZ);
        document.getElementById("form-model").value = "";
        const delBtn = document.getElementById("delete-btn");
        delBtn.disabled = !artifact?.id;
    }

    function setEditMode(isEdit) {
        document.getElementById("view-pane").classList.toggle("hidden", isEdit);
        document.getElementById("edit-pane").classList.toggle("hidden", !isEdit);
        document.getElementById("toggle-edit-btn").innerText = isEdit ? "退出编辑" : "编辑模式";
        document.getElementById("right-title").innerText = isEdit ? "文物编辑器" : "文物信息";
    }

    let editMode = false;
    document.getElementById("toggle-edit-btn").addEventListener("click", () => {
        editMode = !editMode;
        setEditMode(editMode);
        document.getElementById("form-status").innerText = "";
        if (editMode) {
            const a = artifacts.find((x) => x.id === selectedArtifactId);
            fillFormFromArtifact(a);
        }
    });

    document.getElementById("refresh-btn").addEventListener("click", () => {
        loadArtifacts();
    });

    document.getElementById("new-btn").addEventListener("click", () => {
        selectedArtifactId = "";
        renderArtifactList();
        updateRightPane(null);
        fillFormFromArtifact(null);
        document.getElementById("form-status").innerText = "正在新增：填写后点击保存。";
    });

    document.getElementById("delete-btn").addEventListener("click", async () => {
        const artifact = artifacts.find((x) => x.id === selectedArtifactId);
        if (!artifact) return;
        if (!confirm(`确定删除「${artifact.name}」吗？(会同时删除它的模型文件)`)) return;

        const status = document.getElementById("form-status");
        status.innerText = "删除中...";
        try {
            const res = await fetch(`/api/artifacts/${encodeURIComponent(artifact.id)}`, { method: "DELETE" });
            if (!res.ok) throw new Error("删除失败");
            status.innerText = "已删除。";
            await loadArtifacts(true);
        } catch (e) {
            status.innerText = `删除失败：${e.message || e}`;
        }
    });

    document.getElementById("artifact-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const status = document.getElementById("form-status");
        status.innerText = "保存中...";

        const payload = new FormData();
        payload.append("name", document.getElementById("form-name").value.trim());
        payload.append("description", document.getElementById("form-description").value.trim());
        payload.append("era", document.getElementById("form-era").value.trim());
        payload.append("category", document.getElementById("form-category").value.trim());
        payload.append("origin", document.getElementById("form-origin").value.trim());
        payload.append("material", document.getElementById("form-material").value.trim());
        payload.append("dimensions", document.getElementById("form-dimensions").value.trim());
        payload.append("emissiveIntensity", document.getElementById("form-emissive-intensity").value.trim() || "0.35");
        payload.append("modelScale", document.getElementById("form-model-scale").value.trim() || "1");
        payload.append("posX", document.getElementById("form-pos-x").value.trim() || "0");
        payload.append("posY", document.getElementById("form-pos-y").value.trim() || "-0.2");
        payload.append("posZ", document.getElementById("form-pos-z").value.trim() || "0");
        payload.append("bgColor", document.getElementById("form-bg-color").value.trim() || "#000000");
        payload.append("envLightIntensity", document.getElementById("form-env-light-intensity").value.trim() || "1");
        payload.append("extraLightColor", document.getElementById("form-extra-light-color").value.trim() || "#ffd8b0");
        payload.append("extraLightIntensity", document.getElementById("form-extra-light-intensity").value.trim() || "0.25");
        payload.append("extraLightX", document.getElementById("form-extra-light-x").value.trim() || "0");
        payload.append("extraLightY", document.getElementById("form-extra-light-y").value.trim() || "2.2");
        payload.append("extraLightZ", document.getElementById("form-extra-light-z").value.trim() || "1.8");

        const file = document.getElementById("form-model").files?.[0];
        if (file) payload.append("model", file);

        try {
            let res;
            if (selectedArtifactId) {
                res = await fetch(`/api/artifacts/${encodeURIComponent(selectedArtifactId)}`, { method: "PUT", body: payload });
            } else {
                res = await fetch(`/api/artifacts`, { method: "POST", body: payload });
            }
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || "保存失败");
            }
            const json = await res.json();
            status.innerText = "已保存。";
            await loadArtifacts(true, json?.artifact?.id);
        } catch (err) {
            status.innerText = `保存失败：${err.message || err}`;
        }
    });

    async function loadArtifacts(selectFirst = true, preferId = "") {
        try {
            const res = await fetch("/api/artifacts");
            if (!res.ok) throw new Error("后端未启动");
            artifacts = await res.json();
            setBackendStatus(true, "已连接");
        } catch (e) {
            artifacts = [];
            setBackendStatus(false, "未连接");
        }

        renderArtifactList();

        const targetId =
            (preferId && artifacts.find((x) => x.id === preferId) ? preferId : "") ||
            (selectedArtifactId && artifacts.find((x) => x.id === selectedArtifactId) ? selectedArtifactId : "") ||
            (selectFirst && artifacts[0]?.id ? artifacts[0].id : "");

        if (targetId) {
            await selectArtifact(targetId);
        } else {
            selectedArtifactId = "";
            updateRightPane(null);
            fillFormFromArtifact(null);
            removeCurrentModel();
            const fallback = createFallbackModel();
            scene.add(fallback);
            currentModel = fallback;
        }
    }
    
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
    window.addEventListener('resize', () => { const w = container.clientWidth, h = container.clientHeight; camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w, h); });

    setEditMode(false);
    loadArtifacts(true);
</script>
</body>
</html>
